name: GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # O projeto usa pnpm (packageManager em package.json + pnpm-lock.yaml).
      # corepack instala a versao exata declarada em packageManager.
      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # EXPO_BASE_URL faz o build sair com assets em /evangelho-do-dia/
      # (subpath do GitHub Pages). O Dockerfile nao define a variavel.
      - name: Export web build
        env:
          EXPO_BASE_URL: /evangelho-do-dia
        run: npx expo export --platform web

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
